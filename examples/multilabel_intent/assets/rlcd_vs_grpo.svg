<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif">
<title>GRPO 与 RLCD 逐阶段对比</title>
<desc>左列 GRPO，右列 RLCD；六个阶段：动作、采样、奖励、优势、更新、目标。优势一行为两者共享的思想。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g>
<rect x="40" y="40" width="290" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="185" y="61" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">GRPO：生成式 LLM（DeepSeek）</text>
<rect x="350" y="40" width="290" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="495" y="61" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">RLCD：Laya 的非自回归决策</text>
</g>
<g>
<rect x="40" y="90" width="290" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="52" y="112" font-size="14" font-weight="500" fill="#3C3489">动作 = 一整段回复（token 序列）</text><text x="52" y="132" font-size="12" fill="#534AB7">自回归 LLM π_θ 逐 token 采样</text><text x="52" y="148" font-size="12" fill="#534AB7">离散、多步；采样成本随长度增长</text>
<rect x="350" y="90" width="290" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="362" y="112" font-size="14" font-weight="500" fill="#085041">动作 = 一个概率分布 q</text><text x="362" y="132" font-size="12" fill="#0F6E56">高斯策略 N(z; μ = logits, σ²)</text><text x="362" y="148" font-size="12" fill="#0F6E56">连续、一步；一次前向，无生成</text>
<line x1="185" y1="162" x2="185" y2="174" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="495" y1="162" x2="495" y2="174" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
<g>
<rect x="40" y="176" width="290" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="52" y="198" font-size="14" font-weight="500" fill="#3C3489">采样：G 条完整回复（解码）</text><text x="52" y="218" font-size="12" fill="#534AB7">成本 ≈ G × 生成 token 数</text><text x="52" y="234" font-size="12" fill="#534AB7">需要 rollout，是主要开销</text>
<rect x="350" y="176" width="290" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="362" y="198" font-size="14" font-weight="500" fill="#085041">采样：G 个加噪 logit 向量</text><text x="362" y="218" font-size="12" fill="#0F6E56">噪声零均值投影（softmax 平移不变）</text><text x="362" y="234" font-size="12" fill="#0F6E56">前向之后在 logit 空间采样，几乎免费</text>
<line x1="185" y1="248" x2="185" y2="260" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="495" y1="248" x2="495" y2="260" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
<g>
<rect x="40" y="262" width="290" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="52" y="284" font-size="14" font-weight="500" fill="#3C3489">奖励：外部结果奖励</text><text x="52" y="304" font-size="12" fill="#534AB7">验证器 / 奖励模型 / 规则</text><text x="52" y="320" font-size="12" fill="#534AB7">稀疏、不可导，只看采样出的文本</text>
<rect x="350" y="262" width="290" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="362" y="284" font-size="14" font-weight="500" fill="#085041">奖励：严格 proper scoring rule</text><text x="362" y="304" font-size="12" fill="#0F6E56">log score + 球面 score（+ RPS）</text><text x="362" y="320" font-size="12" fill="#0F6E56">由 (q, 目标分布) 解析算出，稠密可导</text>
<line x1="185" y1="334" x2="185" y2="346" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="495" y1="334" x2="495" y2="346" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
<g>
<rect x="40" y="348" width="290" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="52" y="370" font-size="14" font-weight="500" fill="#444441">优势：组内相对基线</text><text x="52" y="390" font-size="12" fill="#5F5E5A">(rᵢ − mean_G) / std_G</text><text x="52" y="406" font-size="12" fill="#5F5E5A">同一优势赋给回复的每个 token</text>
<rect x="350" y="348" width="290" height="70" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="362" y="370" font-size="14" font-weight="500" fill="#444441">优势：组内相对基线（借自 GRPO）</text><text x="362" y="390" font-size="12" fill="#5F5E5A">rᵢ − mean_G，按整批的 std 归一</text><text x="362" y="406" font-size="12" fill="#5F5E5A">每个 (样本, 标签) 决策各自一组</text>
<line x1="185" y1="420" x2="185" y2="432" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="495" y1="420" x2="495" y2="432" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
<g>
<rect x="40" y="434" width="290" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="52" y="456" font-size="14" font-weight="500" fill="#3C3489">更新：PPO 裁剪 + 重要性比</text><text x="52" y="476" font-size="12" fill="#534AB7">π_θ / π_old，KL(π_θ ‖ π_ref) 惩罚</text><text x="52" y="492" font-size="12" fill="#534AB7">同一批样本多轮更新（off-policy）</text>
<rect x="350" y="434" width="290" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="362" y="456" font-size="14" font-weight="500" fill="#085041">更新：单步 on-policy REINFORCE</text><text x="362" y="476" font-size="12" fill="#0F6E56">∇log N = (z − μ)/σ²；无裁剪、无 KL</text><text x="362" y="492" font-size="12" fill="#0F6E56">+ 软交叉熵项；σ 从 0.4 退火到 0.1</text>
<line x1="185" y1="506" x2="185" y2="518" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="495" y1="506" x2="495" y2="518" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
<g>
<rect x="40" y="520" width="290" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="52" y="542" font-size="14" font-weight="500" fill="#3C3489">目标：推高被判对的回复</text><text x="52" y="562" font-size="12" fill="#534AB7">mode-seeking，分布变尖</text><text x="52" y="578" font-size="12" fill="#534AB7">概率校准通常变差</text>
<rect x="350" y="520" width="290" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="362" y="542" font-size="14" font-weight="500" fill="#085041">目标：q = 真实分布时得分最大</text><text x="362" y="562" font-size="12" fill="#0F6E56">严格 proper → 唯一最大 → 概率被校准</text><text x="362" y="578" font-size="12" fill="#0F6E56">软标签（教师分布）天然可用</text>
</g>
</svg>
